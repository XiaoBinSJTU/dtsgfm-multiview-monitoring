[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtsgfm-multiview-monitoring"
version = "0.1.0"
description = "Core research implementation of digital twin spatiotemporal graph fusion for low-quality multi-view monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

